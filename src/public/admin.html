<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotVote - Painel Administrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-weight: 800;
      font-size: 2.5rem;
      background: linear-gradient(to right, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 10px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
      transition: 0.3s;
      font-weight: 600;
    }

    .tab:hover {
      background: rgba(255,255,255,0.05);
    }

    .tab.active {
      background: rgba(139, 92, 246, 0.2);
      color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      font-weight: 600;
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
    }

    .group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 10px;
    }

    .group-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .group-id {
      font-size: 12px;
      color: var(--text-muted);
    }

    button {
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }
    .btn-add:hover {
      background: rgba(16, 185, 129, 0.4);
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }
    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    .btn-refresh {
      width: 100%;
      background: rgba(255,255,255,0.1);
      color: white;
      margin-top: 15px;
      padding: 1rem;
    }
    .btn-refresh:hover {
      background: rgba(255,255,255,0.2);
    }

    #notification {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 1rem 2rem;
      border-radius: 2rem;
      color: white;
      font-weight: 600;
      opacity: 0;
      transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1000;
    }

    #notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* QR Code e Status */
    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    .status-WORKING { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-SCAN_QR_CODE { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .status-STOPPED { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .qr-container {
      background: white;
      padding: 15px;
      border-radius: 10px;
      display: none;
      margin: 15px auto;
      width: 250px;
      height: 250px;
    }
    .qr-container img {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BotVote Painel</h1>
            <p>Gerenciamento Centralizado</p>
        </div>

        <div class="glass-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('groups')">📱 Grupos Autorizados</div>
                <div class="tab" onclick="switchTab('connection')">🔌 Conexão WhatsApp</div>
            </div>

            <!-- Aba de Grupos -->
            <div id="tab-groups" class="tab-content active">
                <h2>Lista de Votação</h2>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 15px;">
                    Selecione os grupos do seu WhatsApp onde o bot está autorizado a votar.
                </p>
                <div id="groupsList" class="loading">Carregando seus grupos...</div>
                <button class="btn-refresh" onclick="loadData()">🔄 Atualizar Lista</button>
            </div>

            <!-- Aba de Conexão -->
            <div id="tab-connection" class="tab-content">
                <h2>Status da Sessão</h2>
                <div id="sessionStatusContainer" class="loading">Verificando...</div>
                
                <div style="text-align: center;">
                    <div class="qr-container" id="qrContainer">
                        <p style="color: black; margin-top:0;">Escaneie para conectar:</p>
                        <img id="qrImage" src="" alt="QR Code" />
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn-add" style="flex: 1;" onclick="startSession()">🚀 Iniciar Sessão</button>
                    <button class="btn-refresh" style="flex: 1; margin: 0;" onclick="checkSession()">🔄 Checar Status</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notification"></div>

    <script>
        let wahaGroups = [];
        let targetGroups = [];

        function showNotification(message, isError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.style.background = isError ? 'var(--danger)' : 'var(--success)';
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');

            if(tabId === 'connection') checkSession();
        }

        async function loadData() {
            document.getElementById('groupsList').innerHTML = '<div class="loading">Carregando seus grupos do WhatsApp...</div>';
            try {
                // 1. Busca grupos autorizados no painel
                const resConfig = await fetch('/admin/api/settings');
                const configData = await resConfig.json();
                targetGroups = configData.targetGroups || [];

                // 2. Busca grupos reais do WAHA
                const resWaha = await fetch('/admin/api/waha/groups');
                if (resWaha.ok) {
                    wahaGroups = await resWaha.json();
                    renderGroups();
                } else {
                    document.getElementById('groupsList').innerHTML = '<div class="loading" style="color:var(--danger)">Erro ao buscar grupos do WAHA. Verifique se o WhatsApp está conectado.</div>';
                }
            } catch (err) {
                document.getElementById('groupsList').innerHTML = '<div class="loading" style="color:var(--danger)">Falha de conexão com a API.</div>';
            }
        }

        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = '';
            
            if (!wahaGroups || wahaGroups.length === 0) {
                list.innerHTML = '<div class="loading">Nenhum grupo encontrado no seu WhatsApp.</div>';
                return;
            }

            wahaGroups.forEach(group => {
                const isAuthorized = targetGroups.some(t => t.toLowerCase() === group.name?.toLowerCase());
                
                const item = document.createElement('div');
                item.className = 'group-item';
                item.innerHTML = `
                    <div>
                        <div class="group-name">📁 ${group.name || 'Grupo sem nome'}</div>
                        <div class="group-id">${group.id}</div>
                    </div>
                    <button class="${isAuthorized ? 'btn-remove' : 'btn-add'}" 
                            onclick="toggleGroup('${group.name}', ${isAuthorized})">
                        ${isAuthorized ? 'Remover ❌' : 'Adicionar ✅'}
                    </button>
                `;
                list.appendChild(item);
            });
        }

        async function toggleGroup(name, isRemoving) {
            try {
                const res = await fetch('/admin/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: isRemoving ? 'remove' : 'add', group: name })
                });
                
                if (res.ok) {
                    showNotification(`Grupo ${isRemoving ? 'removido' : 'adicionado'} com sucesso!`);
                    loadData();
                } else {
                    showNotification('Falha ao processar grupo', true);
                }
            } catch (err) {
                showNotification('Erro de conexão', true);
            }
        }

        // --- ABA CONEXÃO WAHA --- //

        async function checkSession() {
            const container = document.getElementById('sessionStatusContainer');
            const qrContainer = document.getElementById('qrContainer');
            
            try {
                container.innerHTML = '<div class="loading">Buscando status...</div>';
                const res = await fetch('/admin/api/waha/session');
                const data = await res.json();
                
                let statusText = data.status || 'STOPPED';
                let statusName = statusText === 'WORKING' ? 'Conectado ✅' : (statusText === 'SCAN_QR_CODE' ? 'Aguardando Leitura 📷' : 'Parado 🛑');
                
                container.innerHTML = `<span class="status-badge status-${statusText}">${statusName}</span>`;

                if (statusText === 'SCAN_QR_CODE') {
                    qrContainer.style.display = 'block';
                    // Tenta puxar o QR Code através da rota protegida do WAHA (Waha usa auth?)
                    // Precisamos que o container waha não esteja exposto ou proxy
                    // Se for no waha: http://SEU_IP:3000/api/sessions/default/auth/qr mas waha não tem ssl.
                    // O app.js não tem proxy pro QR code, então precisamos bater na API do WAHA?
                    // Espere, tem proxy configurado no Caddy? No Caddy, /waha/* vai pro waha:3000!
                    document.getElementById('qrImage').src = `/waha/api/sessions/default/auth/qr?format=raw&timestamp=${Date.now()}`;
                } else {
                    qrContainer.style.display = 'none';
                }

            } catch (err) {
                container.innerHTML = '<div class="loading" style="color:var(--danger)">Erro de conexão.</div>';
                qrContainer.style.display = 'none';
            }
        }

        async function startSession() {
            try {
                await fetch('/admin/api/waha/start', { method: 'POST' });
                showNotification('Comando de iniciar enviado!');
                setTimeout(checkSession, 2000);
            } catch (e) {
                showNotification('Erro ao iniciar', true);
            }
        }

        // Auto load initial data
        loadData();
    </script>
</body>
</html>
